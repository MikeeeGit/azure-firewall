# Azure Repos PR checks are enforced by build-validation policies.
trigger:
  branches:
    include: [main, develop]
  paths:
    exclude: ["*.md", "**/*.md"]
pr:
  branches:
    include: [main, develop]
  paths:
    exclude: ["*.md", "**/*.md"]
resources:
  repositories:
    - repository: deliveryTemplates
      type: git
      name: terraform-delivery-templates
      ref: 281d779aced9c6e7da082b5e57c85639dc1858df
jobs:
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: terraform
      directory: .
      testDirectory: tests
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: config_uks_hub
      directory: .
      testDirectory: tests/targets
      varFiles: |
        config/global.tfvars
        config/uks/hub/hub.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: config_ukw_hub
      directory: .
      testDirectory: tests/targets
      varFiles: |
        config/global.tfvars
        config/ukw/hub/hub.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: cross_spoke_https
      directory: .
      testDirectory: tests/targets
      varFiles: |
        config/global.tfvars
        config/uks/hub/hub.tfvars
        examples/cross-spoke-https.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: platform_egress
      directory: .
      testDirectory: tests/platform-egress
      varFiles: |
        config/global.tfvars
        config/uks/hub/hub.tfvars
        examples/aks-platform/egress.tfvars
